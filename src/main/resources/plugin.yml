name: EterJob
version: '${version}'

main: fr.eternom.eterJob.Main
api-version: '26.2'
load: POSTWORLD
authors: [ NadTum ]
description: La guilde des métiers (quêtes du jour, de la semaine, histoire, niveaux, rangs, avantages dans le monde ressource).
depend: [EterLib, EterEconomy]
# EterNpc : marqueur « ! » au-dessus du donneur de quêtes ; EterClan : pas de progrès sur le terrain d'un autre clan
softdepend: [EterNpc, EterClan, EterSuccess]

commands:
  job:
    description: Tes quêtes de métier, la guilde, les avantages, l'historique, le classement.
    usage: /job [guilde|avantages|historique|top <métier>|messages|<joueur>]
    aliases: [jobs, metier, metiers]
    permission: eterjob.use
  eterjob:
    description: Gestion des métiers (staff).
    usage: /eterjob <player|setjob|cooldown|clearquests|reroll|remove|setlevel|addxp|setstory|quests|reload|stats|event>
    permission: eterjob.admin

permissions:
  eterjob.use:
    description: Les métiers (/job), et les PNJ de la guilde.
    default: true
  eterjob.admin:
    description: Gestion des métiers (/eterjob) et alertes de cadence anormale.
    default: op
    children:
      eterjob.use: true
