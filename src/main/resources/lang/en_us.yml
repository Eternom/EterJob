# EterJob texts (MiniMessage). Palette: <primary> <accent> <info> <error> <success> (EterLib/config.yml).

job:
  reminder: "<info>You have no job yet: it is the server's real income. <accent><click:run_command:'/job guild'>[Choose a job]</click></accent> <dark_gray>(or the guild master in the lobby)"
  name:
    mineur: "Miner"
    bucheron: "Lumberjack"
    fermier: "Farmer"
    chasseur: "Hunter"
    pecheur: "Fisher"
  none: "<info>You don't have a job yet: pick one at the guild."
  unknown: "<error>Unknown job. Jobs: <accent><jobs>"
  already: "<error>That's already your job."
  joined: "<info>Welcome to the <accent><job></accent> guild! Your quests are waiting."
  changed: "<info>You are now a <accent><job></accent>! Change paid <accent><price></accent>. Your progress in your old job is kept."
  change-too-soon: "<error>You changed jobs too recently."
  change-not-enough: "<error>You need <accent><price></accent> to change jobs."
  sidebar: "  <info>Job <accent><job> <#8A8A8A>(<white><count></white> to do)"
  sidebar-none: "  <info>Job <#8A8A8A>none"
  join:
    title: "<primary>Become a <job>"
    body-first: "Join the <job> guild: every day, quests of your job, a weekly quest, and the job's story. Your first job is free."
    body-change: "Leave <current> to become a <job>? It costs <price>, then you can't change for <days> days. Your current quests are lost, but your level in each job is KEPT: come back and you'll find it again."
    confirm: "Join"
    description:
      mineur: "<info>Ores, ingots, stone to dig: the guild pays for mining."
      bucheron: "<info>Logs of every kind, charcoal, apples: the guild pays for wood."
      fermier: "<info>Crops, breeding, farm goods: the guild pays for the fields."
      chasseur: "<info>Monsters to slay and their loot: the guild pays for the hunt."
      pecheur: "<info>Fish, treasures, catch of the day: the guild pays for fishing."

