    description:
      mineur: "<info>Minerais, lingots, pierre à creuser : la guilde paie la mine."
      bucheron: "<info>Bûches de toutes les essences, charbon de bois, pommes : la guilde paie le bois."
      fermier: "<info>Récoltes, élevage, produits de la ferme : la guilde paie les champs."
      chasseur: "<info>Monstres à abattre et leur butin : la guilde paie la chasse."
      pecheur: "<info>Poissons, trésors, prises du jour : la guilde paie la pêche."

