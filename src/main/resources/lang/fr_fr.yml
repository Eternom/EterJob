    body-change: "Quitter <current> pour devenir <job> ? Cela coûte <price>, puis tu ne pourras plus changer pendant <days> jours. Tes quêtes en cours sont perdues, mais ton niveau dans chaque métier est GARDÉ : en revenant, tu le retrouves."
