    meta: {kind: rare, tier: normal, reward: 320}
    stages:
      - id: peche
        text: "<info>Remplis tes paniers"
        objectives: [ "FISH:COD:24", "FISH:SALMON:12" ]
      - id: cuisine
        text: "<info>Cuisine la pêche"
        objectives: [ "SMELT:COOKED_COD:24", "SMELT:COOKED_SALMON:12" ]
      - id: vente
        text: "<info>Vends du poisson aux villageois"
        objectives: [ "TRADE:ANY:4" ]
  pecheur-rare-06:
    name: "<light_purple>La course au banc"
    description: [ "<info>Un banc de saumons remonte la rivière : il passe vite !" ]
    reputation: 2
    meta: {kind: rare, tier: hard, reward: 450}
    stages:
      - id: preparation
        text: "<info>Prépare ta canne : il te faut une canne neuve"
        objectives: [ "CRAFT:FISHING_ROD:1" ]
      - id: banc
        text: "<info>Pêche 12 saumons en 10 minutes !"
        time-limit: 600
        objectives: [ "FISH:SALMON:12" ]
  pecheur-rare-07:
    name: "<light_purple>Les abysses"
    reputation: 3
    meta: {kind: rare, tier: hard, reward: 500, min-rank: artisan}
    objectives:
      - {type: explore, target: DEEP_OCEAN, amount: 1}
      - {type: kill, target: GUARDIAN, amount: 10}
      - {type: deliver, target: WET_SPONGE, amount: 1, optional: true, scale: false}
      - {type: deliver, target: PRISMARINE_SHARD, amount: 24}

  # ---------- Nouvelles quêtes de la semaine ----------
  pecheur-semaine-04:
    name: "<gold>Le grand concours de pêche"
    reputation: 3
    meta: {kind: weekly, reward: 1050, xp: 220}
    stages:
      - id: concours
        text: "<info>Pêche autant que tu peux"
        objectives: [ "FISH:#fish:250", "FISH:PUFFERFISH:8", "FISH:TROPICAL_FISH:8" ]
      - id: pesee
        text: "<info>Apporte les plus belles prises à la guilde"
        objectives: [ "DELIVER:COOKED_SALMON:32", "DELIVER:PUFFERFISH:4" ]
  pecheur-semaine-05:
    name: "<gold>Le tour des océans"
    reputation: 3
    meta: {kind: weekly, reward: 1000, xp: 210, min-rank: compagnon}
    objectives:
      - {type: fish, target: ANY, amount: 40, where: {biomes: [frozen_ocean, deep_frozen_ocean, cold_ocean]}}
      - {type: fish, target: ANY, amount: 40, where: {biomes: [warm_ocean, lukewarm_ocean]}}
      - {type: deliver, target: NAUTILUS_SHELL, amount: 2}
