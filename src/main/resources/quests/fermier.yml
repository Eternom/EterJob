  # ---------- Au village (lobby) : Mathurin le Fermier et Aurèle le Vigneron ----------
  # Les récoltes faites pour ces quêtes vont au « panier de la commande » : pas d'objet, et pas compté dans le
  # plafond de récolte du jour des Champs. Réputation auprès du PNJ : réputation du joueur × son ratio (EterNpc).
  fermier-village-commande:
    name: "<gold>La commande de Mathurin"
    description: [ "<info>Le fermier du village manque de bras pour ses Champs." ]
    requires: [ "reputation eternpc:fermier 10" ]
    reputation: 2
    meta: {kind: daily, tier: normal, reward: 230}
    stages:
      - id: rencontre
        text: "<info>Va voir <accent>Mathurin</accent>, le fermier du village (lobby)"
        objectives: [ {type: talk, npc: fermier} ]
        say: [ "Ah, c'est la guilde qui t'envoie ? Parfait !", "Il me faut du blé de mes Champs, et vite : le moulin attend." ]
      - id: recolte
        text: "<info>Récolte le blé des Champs du village"
        objectives:
          - {type: signal, key: eterhub:harvest, match: {crop: wheat}, amount: 48, text: "Blé des Champs du village"}
        turn-in: [ npc:fermier ]
        say: [ "Magnifique ! Le moulin va tourner toute la nuit. Merci, {player} !" ]
  fermier-village-vendanges:
    name: "<dark_purple>Les vendanges d'Aurèle"
    description: [ "<info>Le vigneron prépare sa cuvée : il lui faut des grappes." ]
    requires: [ "reputation eternpc:vigneron 10" ]
    reputation: 2
    meta: {kind: daily, tier: normal, reward: 230}
    stages:
      - id: rencontre
        text: "<info>Va voir <accent>Aurèle</accent>, le vigneron du village"
        objectives: [ {type: talk, npc: vigneron} ]
        say: [ "Les grappes sont mûres, il faut les cueillir avant qu'elles ne tombent.", "Rapporte-m'en, et choisis les plus belles si tu peux !" ]
      - id: cueillette
        text: "<info>Cueille des grappes dans les Vignes"
        objectives:
          - {type: signal, key: eterhub:harvest, match: {crop: grape}, amount: 24, text: "Grappes des Vignes"}
          - {type: signal, key: eterhub:harvest, match: {crop: grape, quality: [fine, golden]}, amount: 2, optional: true, scale: false, text: "Belles grappes"}
        turn-in: [ npc:vigneron ]
        say: [ "Quel parfum ! Cette cuvée portera ton nom, {player}." ]
  fermier-village-tournee:
    name: "<gold>La tournée des champs"
    description: [ "<info>Mathurin veut savoir comment se porte chaque parcelle de blé." ]
    requires: [ "reputation eternpc:fermier 15" ]
    reputation: 3
    meta: {kind: rare, tier: normal, reward: 320}
    stages:
      - id: rencontre
        text: "<info>Va voir <accent>Mathurin</accent> au village"
        objectives: [ {type: talk, npc: fermier} ]
        say: [ "Fais le tour des trois champs de blé : l'ouest, le sud et l'est.", "Rapporte-moi un peu de chacun, que je compare." ]
      - id: tournee
        text: "<info>Récolte du blé dans chacun des trois champs"
        objectives:
          - {type: signal, key: eterhub:harvest, match: {crop: wheat, zone: champs-ble-ouest}, amount: 16, text: "Blé du champ de l'ouest"}
          - {type: signal, key: eterhub:harvest, match: {crop: wheat, zone: champs-ble-sud}, amount: 16, text: "Blé du champ du sud"}
          - {type: signal, key: eterhub:harvest, match: {crop: wheat, zone: champs-ble-est}, amount: 16, text: "Blé du champ de l'est"}
        turn-in: [ npc:fermier ]
        say: [ "Le champ de l'est a soif, je le savais... Merci pour ton aide, {player}." ]
  fermier-village-belles-recoltes:
    name: "<gold>Le concours de Mathurin"
    description: [ "<info>La foire approche : Mathurin veut présenter ses plus beaux légumes." ]
    requires: [ "reputation eternpc:fermier 25" ]
    reputation: 4
    meta: {kind: rare, tier: hard, reward: 450}
    stages:
      - id: rencontre
        text: "<info>Va voir <accent>Mathurin</accent> au village"
        objectives: [ {type: talk, npc: fermier} ]
        say: [ "Pour la foire, il me faut ce qu'il y a de plus beau.", "Des carottes et des patates de belle qualité. Une dorée, et je te serais éternellement reconnaissant !" ]
      - id: selection
        text: "<info>Récolte des légumes de belle qualité"
        objectives:
          - {type: signal, key: eterhub:harvest, match: {crop: carrot, quality: [fine, golden]}, amount: 6, text: "Belles carottes"}
          - {type: signal, key: eterhub:harvest, match: {crop: potato, quality: [fine, golden]}, amount: 6, text: "Belles patates"}
          - {type: signal, key: eterhub:harvest, match: {quality: golden}, amount: 1, optional: true, scale: false, text: "Une récolte dorée"}
        turn-in: [ npc:fermier ]
        say: [ "Le premier prix est à nous, j'en suis sûr !" ]
  fermier-village-course:
    name: "<gold>Avant l'orage"
    description: [ "<info>Un orage arrive sur le village : tout doit être rentré à temps !" ]
    requires: [ "reputation eternpc:fermier 20" ]
    reputation: 3
    meta: {kind: rare, tier: hard, reward: 420}
