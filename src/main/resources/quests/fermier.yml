# Quêtes du métier « fermier » (EterJob). Rechargées par /eterjob reload, sur tout le réseau.
#
# Une quête : tier (easy, normal, hard), reward (Heloks), xp (XP de métier ; sinon celle du niveau, voir config.yml),
# min-rank (apprenti, compagnon, artisan, expert, maitre : tirée seulement à partir de ce rang), objectives.
# Objectif : "TYPE:CIBLE:QUANTITÉ"
#   ITEM     objets à livrer au donneur de quêtes (simples, sans nom ni enchantement)
#   BREAK    casser des blocs naturels (pas posés par un joueur)       HARVEST  récolter des cultures mûres
#   KILL     tuer des créatures (apparues naturellement)                FISH     pêcher
#   CRAFT    fabriquer          SMELT  sortir d'un four                 BREED    faire se reproduire des animaux
#   EXPLORE  entrer dans un biome (CIBLE = biome, ex : LUSH_CAVES)      ENCHANT  enchanter (table)
#   TRADE    commercer avec un villageois
# CIBLE : une matière, une créature, ANY (n'importe laquelle), ou un groupe : #ores #logs #crops #fish #stone #flowers
# Au plus 3 objectifs d'action (tout sauf ITEM) par quête. Quantités et récompense augmentent avec le rang du joueur.
#
# daily  : quêtes du jour (une par niveau, puis la bonus) ; weekly : la quête de la semaine (longue, bien payée) ;
# rare   : une petite chance de remplacer une quête du jour ; story : l'histoire du métier, une étape par rang
#          (title, text : le lore, en MiniMessage).

