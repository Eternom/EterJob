# Quêtes du métier « mineur » (EterJob), au format d'EterQuest (le moteur des quêtes, partagé avec tout le réseau).
# Après un changement : AUGMENTER « version » ci-dessous (la plus haute l'emporte partout), puis /eterjob reload.
#
# Chaque quête : un identifiant définitif (minuscules, chiffres, - et _), puis :
#   meta     ce que la guilde en fait : kind (daily, weekly, rare, story), tier (easy, normal, hard), reward (Heloks,
#            × la taille du rang), xp (XP de métier ; sinon celle du niveau, config.yml), min-rank (tirée à partir de ce
#            rang : apprenti, compagnon, artisan, expert, maitre), rank (story : l'étape de ce rang)
#   name, description   nom et texte (MiniMessage) ; sans nom : « Quête facile », « ✦ Quête rare »...
#   requires conditions pour être tirée : « reputation <pnj> <min> » (réputation × ratio du PNJ), « done <quête> »...
#   reputation          réputation gagnée à la fin (1 par défaut ici)
#   objectives (une étape) ou stages (plusieurs : id, text, objectives, turn-in, say, time-limit, branches...)
# Objectif : "TYPE:CIBLE:QUANTITÉ" ou {type, target, amount, where, optional, scale, text}
#   break harvest kill fish craft smelt breed explore enchant trade : actions du jeu (cible, ANY, ou un groupe
#   #ores #logs #crops #fish #stone #flowers) ; deliver : objets à remettre ; talk : parler à un PNJ (npc: farmer) ;
#   signal : ce que fait le village (eterhub:harvest {crop, quality, zone}, eterhub:fish {fish, rarity, grams}...)
#   where : {time: day|night, weather: rain|thunder|clear, biomes: [...], dimension: nether, min-y, max-y}
#   optional: true -> objectif bonus (pas nécessaire) ; scale: false -> la quantité ne grandit pas avec le rang
# turn-in : où se rend la dernière étape. Par défaut ici : au donneur de quêtes (giver), ou à distance (remote, /job)
#   s'il n'y a pas d'objets à remettre ; npc:<pnj> : chez ce PNJ (ex : au village).
# Seules les créatures apparues naturellement comptent (pas les spawners d'épreuve, ni celles posées avec une
# structure : shulkers, gardien ancien, brutes piglins).

version: 1
defaults:
  category: job
  tags: [mineur]
  turn-in: [giver, remote]
  reputation: 1
  meta: {job: mineur}

quests:

  # ---------- Quêtes du jour (une par niveau chaque jour ; jamais celles d'hier) ----------
