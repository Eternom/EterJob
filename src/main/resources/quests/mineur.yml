  # ---------- L'histoire du métier : une étape par rang ----------
  mineur-histoire-apprenti:
    name: "<primary>La première galerie"
    description: [ "<info>Le vieux Brann te tend une pioche ébréchée.", "<info>« Prouve que tu sais creuser, et la guilde t'ouvrira ses portes. »" ]
    reputation: 5
    abandon: false
    meta: {kind: story, reward: 300, xp: 150, rank: apprenti}
    objectives: [ "BREAK:STONE:256", "DELIVER:COAL:32" ]
  mineur-histoire-compagnon:
    name: "<primary>Le filon de fer"
    description: [ "<info>Les forges de la guilde manquent de fer.", "<info>Brann t'indique une veine oubliée, sous les collines." ]
