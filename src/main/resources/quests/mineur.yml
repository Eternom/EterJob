        text: "<info>Extrais le minerai"
        objectives: [ "BREAK:IRON_ORE:24", "BREAK:GOLD_ORE:8" ]
      - id: forge
        text: "<info>Fais-le fondre"
        objectives: [ "SMELT:IRON_INGOT:32", "SMELT:GOLD_INGOT:8" ]
