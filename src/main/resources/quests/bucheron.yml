  # ---------- L'histoire du métier : une étape par rang ----------
  bucheron-histoire-apprenti:
    name: "<primary>La première hache"
    description: [ "<info>Maëlle, la doyenne des bûcherons, t'observe.", "<info>« Un arbre se respecte. Coupe-le, puis replante. »" ]
    reputation: 5
    abandon: false
    meta: {kind: story, reward: 300, xp: 150, rank: apprenti}
    objectives: [ "BREAK:OAK_LOG:128", "DELIVER:OAK_SAPLING:16" ]
  bucheron-histoire-compagnon:
