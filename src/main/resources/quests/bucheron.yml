  bucheron-jour-02:
    meta: {kind: daily, tier: easy, reward: 120}
    objectives: [ "BREAK:BIRCH_LOG:48", "DELIVER:BIRCH_LOG:16" ]
  bucheron-jour-03:
    meta: {kind: daily, tier: easy, reward: 130}
