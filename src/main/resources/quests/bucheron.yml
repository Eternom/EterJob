      - {type: break, target: PALE_OAK_LOG, amount: 96}
      - {type: deliver, target: PALE_HANGING_MOSS, amount: 16}
      - {type: deliver, target: RESIN_CLUMP, amount: 4, optional: true, scale: false}
  bucheron-rare-07:
