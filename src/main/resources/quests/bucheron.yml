        text: "<info>Coupe le bois"
        objectives: [ "BREAK:OAK_LOG:64", "BREAK:BIRCH_LOG:64" ]
      - id: rayonnages
        text: "<info>Fabrique les rayonnages"
        objectives: [ "CRAFT:BOOKSHELF:8", "CRAFT:LECTERN:2" ]
      - id: livraison
        text: "<info>Livre-les à la guilde"
